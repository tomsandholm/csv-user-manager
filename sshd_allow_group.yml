---
- name: Allow the host group to log in through SSH
  hosts: virt
  become: true
  vars:
    # Converts a host such as tom1.tsand.org to tom1-tsand-org.
    machine_groupname: "{{ inventory_hostname | replace('.', '-') }}"

  tasks:
    - name: Ensure the host access group exists
      ansible.builtin.group:
        name: "{{ machine_groupname }}"
    - name: Allow the host group to authenticate through SSH
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        state: present
        regexp: '^AllowGroups(?:\s+|$)'
        line: "AllowGroups ansible sudo {{ machine_groupname }}"
        validate: '/usr/sbin/sshd -t -f %s'
      notify: Restart sshd

  handlers:
    - name: Restart sshd
      ansible.builtin.service:
        name: ssh
        state: restarted
