---
- name: Remove the host group from SSH access
  hosts: virt
  become: true
  vars:
    # Converts a host such as tom1.tsand.org to tom1-tsand-org.
    machine_groupname: "{{ inventory_hostname | replace('.', '-') }}"

  tasks:
    - name: Remove the host group while retaining administrative SSH access
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        state: present
        regexp: '^AllowGroups(?:\s+|$)'
        line: "AllowGroups ansible sudo"
        validate: '/usr/sbin/sshd -t -f %s'
      notify: Restart sshd

  handlers:
    - name: Restart sshd
      ansible.builtin.service:
        name: ssh
        state: restarted
