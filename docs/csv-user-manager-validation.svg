<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740">
  <defs>
    <style>
      .bg { fill: #f9f9f9; }
      .panel { fill: #ffffff; stroke: #d6d6d6; stroke-width: 1; }
      .header { fill: #f2f2f2; stroke: #d6d6d6; stroke-width: 1; }
      .title { font: 700 24px Arial; fill: #222; }
      .small { font: 400 13px Arial; fill: #4d4d4d; }
      .cell { fill: #fff; stroke: #cfcfcf; }
      .input { fill: #fff; stroke: #b7b7b7; }
      .error { fill: #ffe6e6; stroke: #d74e4e; }
      .alert { fill: #fff0f0; stroke: #d74e4e; }
      .button { fill: #007bff; }
      .button-text { font: 700 18px Arial; fill: white; }
      .red { fill: #c00; font: 700 14px Arial; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="740"/>
  <text class="title" x="40" y="52">CSV User Management System</text>
  <rect class="alert" x="40" y="80" width="1120" height="70" rx="4"/>
  <text class="red" x="66" y="108">CSV file was not updated:</text>
  <text class="small" x="66" y="130">• Each user must have a username.</text>
  <text class="small" x="66" y="146">• Duplicate uid values are not allowed: 1002.</text>

  <g>
    <rect class="panel" x="40" y="170" width="1120" height="500" rx="4"/>
    <rect class="header" x="40" y="170" width="1120" height="34"/>
    <text class="small" x="64" y="192" font-weight="700">Add New User Entry:</text>
    <rect class="cell" x="40" y="204" width="1120" height="56"/>
    <rect class="input" x="58" y="220" width="120" height="24" rx="2"/>
    <rect class="input error" x="188" y="220" width="90" height="24" rx="2"/>
    <rect class="input" x="288" y="220" width="90" height="24" rx="2"/>
    <rect class="input" x="388" y="220" width="150" height="24" rx="2"/>
    <rect class="input" x="548" y="220" width="150" height="24" rx="2"/>
    <rect class="input" x="708" y="220" width="180" height="24" rx="2"/>
    <rect class="input" x="898" y="220" width="120" height="24" rx="2"/>

    <rect class="header" x="40" y="260" width="1120" height="34"/>
    <text class="small" x="64" y="282" font-weight="700">Existing Users:</text>
    <g>
      <rect class="header" x="40" y="294" width="1120" height="32"/>
      <text class="small" x="55" y="316" font-weight="700">Username</text>
      <text class="small" x="180" y="316" font-weight="700">UID</text>
      <text class="small" x="282" y="316" font-weight="700">GID</text>
      <text class="small" x="390" y="316" font-weight="700">Email</text>
      <text class="small" x="555" y="316" font-weight="700">Home Directory</text>
      <text class="small" x="708" y="316" font-weight="700">Public Key</text>
      <text class="small" x="898" y="316" font-weight="700">Authorized Host</text>
      <text class="small" x="1055" y="316" font-weight="700">Delete</text>
    </g>

    <g>
      <rect class="cell" x="40" y="326" width="1120" height="48"/>
      <rect class="input error" x="58" y="338" width="120" height="22" rx="2"/>
      <rect class="input error" x="188" y="338" width="90" height="22" rx="2"/>
      <rect class="input" x="288" y="338" width="90" height="22" rx="2"/>
      <rect class="input" x="388" y="338" width="150" height="22" rx="2"/>
      <rect class="input" x="548" y="338" width="150" height="22" rx="2"/>
      <rect class="input" x="708" y="338" width="180" height="22" rx="2"/>
      <rect class="input" x="898" y="338" width="120" height="22" rx="2"/>
      <rect class="input" x="1055" y="338" width="26" height="22" rx="2"/>
    </g>
    <g>
      <rect class="cell" x="40" y="374" width="1120" height="48"/>
      <rect class="input" x="58" y="386" width="120" height="22" rx="2"/>
      <rect class="input" x="188" y="386" width="90" height="22" rx="2"/>
      <rect class="input" x="288" y="386" width="90" height="22" rx="2"/>
      <rect class="input" x="388" y="386" width="150" height="22" rx="2"/>
      <rect class="input" x="548" y="386" width="150" height="22" rx="2"/>
      <rect class="input" x="708" y="386" width="180" height="22" rx="2"/>
      <rect class="input" x="898" y="386" width="120" height="22" rx="2"/>
      <rect class="input" x="1055" y="386" width="26" height="22" rx="2"/>
    </g>
  </g>
  <rect class="button" x="1020" y="682" width="140" height="42" rx="4"/>
  <text class="button-text" x="1065" y="710">Save</text>
</svg>
