  <text x="36" y="40" font-family="Liberation Sans, DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#111827">kvm1 system</text>
  <text x="36" y="64" font-family="Liberation Sans, DejaVu Sans, sans-serif" font-size="14" fill="#4b5563">Bare-metal Dell PowerEdge R660 - Ubuntu 26.04.1 LTS - sv-fwdev-1</text>

