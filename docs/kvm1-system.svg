<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1140" width="1600" height="1140" role="img" aria-label="kvm1 bare-metal Ubuntu 26.04 host with libvirt, NFS, ansible, cockpit, hardware RAID, br0, and VM NFS clients">
