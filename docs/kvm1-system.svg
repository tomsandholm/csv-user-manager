  <text x="1508" y="34" font-family="Liberation Sans, DejaVu Sans, sans-serif" font-size="12" fill="#111827">storage</text>

  <!-- HOST -->
  <rect x="24" y="84" width="1552" height="548" rx="12" fill="#ffffff" stroke="#111827" stroke-width="1.75"/>
  <rect x="24" y="84" width="1552" height="52" rx="12" fill="#111827"/>
  <rect x="24" y="120" width="1552" height="16" fill="#111827"/>
  <text x="44" y="118" font-family="Liberation Sans, DejaVu Sans, sans-serif" font-size="16" font-weight="700" fill="#ffffff">kvm1 host  |  bare metal  |  Ubuntu 26.04.1  |  64 CPU  |  499 GiB RAM  |  100.113.58.224/24</text>

  <!-- hardware raid -->
  <rect x="44" y="156" width="1512" height="56" rx="8" fill="#e5e7eb" stroke="#4b5563" stroke-width="1.25"/>
  <text x="64" y="180" font-family="Liberation Sans, DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#111827">Hardware RAID - PERC H755 Front</text>
  <text x="64" y="200" font-family="Liberation Sans, DejaVu Sans, sans-serif" font-size="12" fill="#374151">VD238 RAID1 2.182 TB -&gt; /dev/sda (OS)     VD239 RAID5 10.913 TB -&gt; /dev/sdb (data)     8 x SAS HDD     WriteBack     Optimal     no hot spare</text>

  <!-- services -->
  <rect x="44" y="226" width="288" height="78" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="64" y="254" font-family="Liberation Sans, DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#111827">libvirtd</text>
  <text x="64" y="276" font-family="Liberation Sans, DejaVu Sans, sans-serif" font-size="12" fill="#5b21b6">enabled / active  |  QEMU/KVM</text>
  <text x="64" y="294" font-family="Liberation Sans, DejaVu Sans, sans-serif" font-size="12" fill="#5b21b6">cockpit-machines</text>

  <rect x="348" y="226" width="288" height="78" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="368" y="254" font-family="Liberation Sans, DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#111827">nfs-server</text>
  <text x="368" y="276" font-family="Liberation Sans, DejaVu Sans, sans-serif" font-size="12" fill="#1e3a8a">enabled / active  |  NFSv4.2 TCP 2049</text>
  <text x="368" y="294" font-family="Liberation Sans, DejaVu Sans, sans-serif" font-size="12" fill="#1e3a8a">exports /share/opt and /usr/share/home</text>

  <rect x="652" y="226" width="288" height="78" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.25"/>
