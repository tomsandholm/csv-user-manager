  <text x="80" y="474" font-family="Liberation Sans, DejaVu Sans, sans-serif" font-size="12" fill="#5b21b6">/var/lib/libvirt  VM disks</text>

  <rect x="420" y="432" width="348" height="56" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.35"/>
  <text x="436" y="454" font-family="Liberation Sans, DejaVu Sans, sans-serif" font-size="13" font-weight="700" fill="#111827">lv_share_home  4.09T xfs</text>
  <text x="436" y="474" font-family="Liberation Sans, DejaVu Sans, sans-serif" font-size="12" fill="#1e3a8a">/usr/share/home  NFS + uquota</text>

  <rect x="64" y="504" width="704" height="84" rx="6" fill="#eef2ff" stroke="#2563eb" stroke-width="1.35"/>
