---
- name: Update the managed CSV User Manager groups
  hosts: virt
  become: true
  gather_facts: false
  serial: 1

  vars:
    group_file: /etc/group
    hosts_group_block_file: /var/www/html/hosts-block.txt
    users_group_block_file: /var/www/html/groups-block.txt
    group_block_marker: "CSV User Manager managed groups"

  pre_tasks:
    - name: Read the generated host groups block from the controller
      ansible.builtin.set_fact:
        csv_user_manager_hosts_group_block: "{{ lookup('ansible.builtin.file', hosts_group_block_file) }}"
      delegate_to: localhost
      delegate_facts: true
      become: false
      run_once: true

    - name: Read the generated user groups block from the controller
      ansible.builtin.set_fact:
        csv_user_manager_users_group_block: "{{ lookup('ansible.builtin.file', users_group_block_file) }}"
      delegate_to: localhost
      delegate_facts: true
      become: false
      run_once: true

    - name: Ensure both generated group blocks are not empty
      ansible.builtin.assert:
        that:
          - hostvars['localhost'].csv_user_manager_hosts_group_block | trim | length > 0
          - hostvars['localhost'].csv_user_manager_users_group_block | trim | length > 0
        fail_msg: >-
          Both {{ hosts_group_block_file }} and {{ users_group_block_file }} must
          contain generated group entries. Publish hosts-block.txt and
          users-block.txt before running this playbook.
      become: false
      run_once: true

    - name: Combine the generated host and user group blocks
      ansible.builtin.set_fact:
        csv_user_manager_group_block: |-
          {{ hostvars['localhost'].csv_user_manager_hosts_group_block | trim }}
          {{ hostvars['localhost'].csv_user_manager_users_group_block | trim }}
      delegate_to: localhost
      delegate_facts: true
      become: false
      run_once: true

  tasks:
    - name: Insert the combined host and user groups block in /etc/group
      ansible.builtin.blockinfile:
        path: "{{ group_file }}"
        marker: "# {mark} {{ group_block_marker }}"
        block: "{{ hostvars['localhost'].csv_user_manager_group_block | trim }}"
        insertafter: EOF
        create: false
        backup: true
